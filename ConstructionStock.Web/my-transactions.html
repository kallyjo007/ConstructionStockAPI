<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Records - Construction Stock</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/guard.js"></script>
</head>
<body>
    <nav>
        <div class="nav-brand">Construction Stock</div>
        <ul class="nav-links">
            <li><a href="storekeeper.html">Dashboard</a></li>
            <li><a href="my-transactions.html" class="active">My Records</a></li>
            <li><a href="#" onclick="logout()">Logout</a></li>
        </ul>
    </nav>

    <div class="container">
        <header>
            <h1>My Transaction History</h1>
            <p class="text-secondary">Full log of entries you have recorded</p>
        </header>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Type</th>
                        <th>Item</th>
                        <th>Quantity</th>
                        <th>Supplier</th>
                        <th>Status</th>
                        <th>Remarks</th>
                    </tr>
                </thead>
                <tbody id="fullLogTableBody">
                    <!-- Loaded by JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await apiFetch('/transactions/log');
                if (response.success) {
                    const tbody = document.getElementById('fullLogTableBody');
                    response.data.forEach(tx => {
                        const tr = document.createElement('tr');
                        const typeClass = tx.transactionType === 'IN' ? 'badge-success' : 'badge-warning';
                        const statusClass = tx.isApproved ? 'badge-success' : 'badge-danger';
                        const statusText = tx.isApproved ? 'Approved' : 'Pending Approval';
                        
                        const date = new Date(tx.transactionDate).toLocaleString('en-GB', {
                            year: 'numeric',
                            month: 'short',
                            day: 'numeric',
                            hour: '2-digit',
                            minute: '2-digit'
                        });

                        tr.innerHTML = `
                            <td>${date}</td>
                            <td><span class="badge ${typeClass}">${tx.transactionType}</span></td>
                            <td>${tx.itemName}</td>
                            <td>${tx.quantity}</td>
                            <td>${tx.supplierName || '-'}</td>
                            <td><span class="badge ${statusClass}">${statusText}</span></td>
                            <td>${tx.remarks || ''}</td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
            } catch (error) {
                console.error('Failed to load log:', error);
            }
        });
    </script>
</body>
</html>
