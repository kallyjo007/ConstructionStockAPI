<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Items Management - Construction Stock</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/guard.js"></script>
</head>
<body>
    <nav>
        <div class="nav-brand">Construction Stock</div>
        <ul class="nav-links">
            <li><a href="dashboard.html">Dashboard</a></li>
            <li><a href="items.html" class="active">Items</a></li>
            <li><a href="transactions.html">Transactions</a></li>
            <li><a href="alerts.html">Alerts <span id="alertCount" class="badge badge-danger" style="display: none;">0</span></a></li>
            <li><a href="reports.html">Reports</a></li>
            <li><a href="suppliers.html">Suppliers</a></li>
            <li><a href="users.html">Users</a></li>
            <li><a href="#" onclick="logout()">Logout</a></li>
        </ul>
    </nav>

    <div class="container">
        <header class="flex-between">
            <div>
                <h1>Items Catalog</h1>
                <p class="text-secondary">Manage site materials and stock thresholds</p>
            </div>
            <button onclick="openModal()" class="btn btn-primary">+ Add New Item</button>
        </header>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Item Name</th>
                        <th>Unit</th>
                        <th>Current Qty</th>
                        <th>Min Qty</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="itemsTableBody">
                    <!-- Loaded by items.js -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal for Add/Edit -->
    <div id="itemModal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;">
        <div class="auth-card" style="width: 500px;">
            <h2 id="modalTitle">Add New Item</h2>
            <form id="itemForm" class="mt-4">
                <input type="hidden" id="editItemId">
                <div class="form-group">
                    <label for="itemName">Item Name</label>
                    <input type="text" id="itemName" required>
                </div>
                <div class="form-group">
                    <label for="unit">Unit (e.g., Bags, Tons, Pieces)</label>
                    <input type="text" id="unit" required>
                </div>
                <div class="form-group" id="qtyGroup">
                    <label for="currentQuantity">Initial Quantity</label>
                    <input type="number" id="currentQuantity" min="0" value="0">
                </div>
                <div class="form-group">
                    <label for="minimumQuantity">Minimum Threshold (Alert level)</label>
                    <input type="number" id="minimumQuantity" min="1" required>
                </div>
                <div class="flex-between mt-4">
                    <button type="button" onclick="closeModal()" class="btn btn-secondary">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Item</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/items.js"></script>
</body>
</html>
