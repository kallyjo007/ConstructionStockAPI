 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Construction Stock Management</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/guard.js"></script>
</head>
<body class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h1>Construction Stock</h1>
            <p>Sign in to manage your site stock</p>
        </div>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="role">Role</label>
                <select id="role" required>
                    <option value="">Select your role...</option>
                    <option value="Admin">Admin</option>
                    <option value="StockManager">Stock Manager</option>
                    <option value="Storekeeper">Storekeeper</option>
                </select>
            </div>
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" required placeholder="Enter your username">
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required placeholder="Enter your password">
            </div>
            
            <div id="errorMessage" style="color: var(--danger-color); font-size: 0.875rem; margin-bottom: 1rem; display: none;"></div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%;">
                Sign In
            </button>
        </form>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const role = document.getElementById('role').value;
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');
            
            errorDiv.style.display = 'none';
            
            const result = await login(username, password, role);
            
            if (result.success) {
                if (result.role === 'StockManager' || result.role === 'Admin') {
                    window.location.href = 'dashboard.html';
                } else {
                    window.location.href = 'storekeeper.html';
                }
            } else {
                errorDiv.textContent = result.message || 'Login failed';
                errorDiv.style.display = 'block';
            }
        });
    </script>
</body>
</html>
